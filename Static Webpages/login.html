<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMA X Studio | Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  
  <nav class="navbar navbar-expand navbar-dark fixed-top">
    <div class="container-fluid px-md-5 px-4">
      <a class="navbar-brand m-0" href="index.html">CINEMA X Studio</a>
      <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
        <a class="nav-link px-2" href="index.html">Home</a>
        <a class="nav-link px-2" href="search.html">Search</a>
        <a class="nav-link px-2" href="watchlist.html">Watchlist</a>
        <a class="nav-link px-2" href="about.html">About Us</a>
        <a class="nav-link px-2" href="profile.html">Profile</a>
        <a class="btn btn-premium nav-action-btn px-3 py-1.5 fs-6 ms-2" href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="container auth-container">
      <div class="row justify-content-center">
        <div class="col-xl-5 col-lg-6 col-md-8 col-sm-10">
          <div class="auth-card">
            <div class="text-center mb-4">
              <h2 class="fw-bold mb-2 letter-tight-0-5">Welcome Back</h2>
              <p class="small text-muted-custom">Access your Cyber Cinematic portal</p>
            </div>

            <form>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label mb-0">Password</label>
                  <a href="#" class="auth-link small">Forgot?</a>
                </div>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
              </div>

              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-muted-custom" for="rememberMe">Remember me on this device</label>
              </div>

              <button type="submit" class="btn btn-premium mb-3 w-100">Log In</button>
            </form>

            <div class="text-center mt-3">
              <p class="small mb-0 text-muted-custom">Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
